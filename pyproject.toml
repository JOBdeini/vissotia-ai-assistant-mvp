[project]
name = "vissotia-assistant-mvp"
version = "0.1.0"
description = "MVP académico del Asistente Vissotia con Gemini, RAG, LangGraph y Streamlit."
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["gemini", "rag", "langgraph", "chromadb", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "langchain>=1.4,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-google-genai>=4.4,<5",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0,<7",
    "streamlit>=1.52,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1,<8",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.14,<1",
    "watchdog>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["vissotia_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vissotia_assistant"]
